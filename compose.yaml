# ChatFrog: 1 container (api). DB là MongoDB Atlas (MONGO_URI trong .env).
# Web là file tĩnh do nginx trên host phục vụ (apps/web/dist).
# Chạy: make up   (podman compose -f compose.yaml --env-file .env up -d --build)

services:
  api:
    container_name: chatfrog-api
    build:
      context: apps/api
      dockerfile: Containerfile
    image: localhost/chatfrog-api:latest
    restart: unless-stopped
    # Factory (LLM) chỉ lắng nghe 127.0.0.1:9220 trên host: chuyển tiếp cổng đó vào container.
    network_mode: "pasta:-T,9220"
    env_file: .env
    environment:
      HTTP_ADDR: ":9260"
      FILES_DIR: /data/files
    ports:
      - "127.0.0.1:9260:9260"
    volumes:
      - chatfrog-files:/data/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9260/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  chatfrog-files:

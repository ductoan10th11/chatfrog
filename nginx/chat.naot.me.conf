# ==============================================================================
# chat.naot.me (ChatFrog), nginx trên host, cổng 80
# TLS do Cloudflare Proxy xử lý bên ngoài.
# Web: file tĩnh apps/web/dist · API: 127.0.0.1:9260 (container chatfrog-api)
#
# Kích hoạt:
#   sudo ln -sf /home/toan/dev/Applications/Chats/nginx/chat.naot.me.conf /etc/nginx/sites-enabled/chat.naot.me.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream chatfrog_api {
    server 127.0.0.1:9260;
    keepalive 32;
}

map $http_x_forwarded_proto $chatfrog_proto {
    default $scheme;
    https   https;
}

log_format chatfrog '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

limit_req_zone $binary_remote_addr zone=chatfrog_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.naot.me;

    root /home/toan/dev/Applications/Chats/apps/web/dist;
    index index.html;

    # IP thật của client qua Cloudflare (https://www.cloudflare.com/ips/)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/chat.naot.me.access.log chatfrog buffer=64k flush=5s;
    error_log  /var/log/nginx/chat.naot.me.error.log warn;

    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TODO(giai đoạn 3): Content-Security-Policy, xem docs/SPEC.md §8.

    # --- API ---------------------------------------------------------------

    # Đăng nhập: giới hạn tần suất
    location ^~ /api/auth/ {
        limit_req zone=chatfrog_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://chatfrog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $chatfrog_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Upload file
    location = /api/files {
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://chatfrog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $chatfrog_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # REST + SSE (chat stream, tạo ảnh): không buffer, timeout dài, không retry
    location ^~ /api/ {
        proxy_pass http://chatfrog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $chatfrog_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_next_upstream off;

        proxy_connect_timeout 2s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # --- Web tĩnh ----------------------------------------------------------

    # Service worker / manifest: luôn kiểm tra bản mới
    location ~ ^/(sw\.js|mockServiceWorker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Asset có hash trong tên (Vite) → cache lâu
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
